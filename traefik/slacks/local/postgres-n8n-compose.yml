services:
  postgres:
    image: postgres:16
    env_file:
      - ../../../shared/.env
    environment:
      POSTGRES_DB: ${N8N_DB_NAME}
      POSTGRES_USER: ${N8N_DB_USER}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - n8n_pgdata:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  n8n_pgdata:

networks:
  backend:
    external: true
